# kaioken module plan — generated by `kaioken plan`, EDIT FREELY before
# running `kaioken generate`. Rename modules, adjust scopes, split or merge.
# Scope entries are repo-relative file paths or directory prefixes.
version: 1
modules:
    - id: root
      title: Repository Root
      description: Top-level configuration, environment template, and agent documentation.
      scope:
        - .env.example
        - .gitignore
        - AGENTS.md
    - id: agent
      title: Go Agent
      description: Local Go CLI that runs the ingest→normalize→embed→cluster→score→summarize→write pipeline.
      scope:
        - agent/go.mod
        - agent/go.sum
      children:
        - id: agent_cmd
          title: CLI Entry Point
          description: Cobra command definitions for run, version, and doctor subcommands.
          scope:
            - agent/cmd/airfoil/doctor.go
            - agent/cmd/airfoil/main.go
            - agent/cmd/airfoil/root.go
            - agent/cmd/airfoil/version.go
        - id: agent_config
          title: Configuration Loading
          description: Loads config from JSON files and .env, derives all runtime paths.
          scope:
            - agent/internal/config/config.go
            - agent/internal/config/dotenv.go
            - agent/internal/config/dotenv_test.go
            - agent/internal/config/files.go
        - id: agent_model
          title: Core Data Types
          description: Shared Go structs for items, stories, sources, and pipeline state.
          scope:
            - agent/internal/model/types.go
        - id: agent_store
          title: JSON Persistence
          description: Reads and writes pipeline data (index, state, stories) as JSON files.
          scope:
            - agent/internal/store/json.go
    - id: config
      title: Pipeline Configuration
      description: JSON files that control sources, scoring weights, and keyword extraction.
      scope:
        - config/keywords.json
        - config/scoring.json
        - config/sources.json
    - id: data
      title: Generated Pipeline Data
      description: 'Runtime outputs: ranked index, deduplication state, and published stories.'
      scope:
        - data/index.json
        - data/state.json
        - data/stories.json
    - id: docs
      title: Documentation
      description: Architecture specs, build instructions, and prompt engineering guides.
      scope:
        - docs/AGENTS.md
        - docs/BUILD_SPEC.md
        - docs/CLAUDE.md
        - docs/IDEA.md
        - docs/PROMPTS.md
        - docs/RUNBOOK.md
        - docs/base_airfoil_design.md
        - docs/main_exemple.html
    - id: site
      title: React Frontend
      description: Static Vite+React site that consumes generated stories and renders dense feed pages.
      scope:
        - site/.gitignore
        - site/.oxlintrc.json
        - site/README.md
        - site/package.json
        - site/tsconfig.json
        - site/tsconfig.app.json
        - site/tsconfig.node.json
        - site/vite.config.ts
      children:
        - id: site_public
          title: Static Assets
          description: SVG icons, favicons, and logos served directly.
          scope:
            - site/public/Header Icon.svg
            - site/public/favicon.svg
            - site/public/header-icon.svg
            - site/public/icons.svg
            - site/public/main logo.svg
        - id: site_src_app
          title: App Shell & Styles
          description: Entry point, router setup, global CSS, and design tokens.
          scope:
            - site/src/main.tsx
            - site/src/App.tsx
            - site/src/index.css
            - site/src/App.css
            - site/src/styles/global.css
            - site/src/styles/tokens.css
        - id: site_src_components
          title: UI Components
          description: Reusable presentational components for story cards, rails, badges, and overlays.
          scope:
            - site/src/components/ActiveFilterBar.tsx
            - site/src/components/AirfoilSVG.tsx
            - site/src/components/Footer.tsx
            - site/src/components/Header.tsx
            - site/src/components/LeftRail.tsx
            - site/src/components/MobileOverlay.tsx
            - site/src/components/RightRail.tsx
            - site/src/components/ScoreBadge.tsx
            - site/src/components/StoryCard.tsx
            - site/src/components/StoryDetail.tsx
            - site/src/components/TagPill.tsx
        - id: site_src_pages
          title: Route Pages
          description: Top-level page components mapped by React Router (feed, search, story, etc.).
          scope:
            - site/src/pages/DigestPage.tsx
            - site/src/pages/FeedPage.tsx
            - site/src/pages/HomePage.tsx
            - site/src/pages/SearchPage.tsx
            - site/src/pages/ShipPage.tsx
            - site/src/pages/StoryPage.tsx
            - site/src/pages/TopPage.tsx
        - id: site_src_hooks
          title: Custom Hooks
          description: Shared logic for theme switching and airfoil signal processing.
          scope:
            - site/src/hooks/useAirfoilSignals.ts
            - site/src/hooks/useTheme.ts
        - id: site_src_types
          title: TypeScript Types
          description: Story, Source, FilterState, and other types mirroring frontmatter schema.
          scope:
            - site/src/types/story.ts
        - id: site_src_data
          title: Mock Data
          description: Development-only mock stories for component preview.
          scope:
            - site/src/data/mockData.ts
        - id: site_src_content
          title: Published Stories
          description: Markdown files with frontmatter generated by the agent pipeline.
          scope:
            - site/src/content/stories/2026-08-11-mistral-sovereign-eu-infrastructure.md
            - site/src/content/stories/2026-08-12-ollama-0-5-windows-model-library.md
            - site/src/content/stories/2026-08-13-hf-state-of-open-models-summer-2026.md
            - site/src/content/stories/2026-08-14-lora-plus-efficient-long-context-finetune.md
            - site/src/content/stories/2026-08-14-scaling-laws-10m-context-transformers.md
            - site/src/content/stories/2026-08-14-vllm-pagedattention-v2-2x-throughput.md
            - site/src/content/stories/2026-08-15-llama-4-maverick-10m-context.md
            - site/src/content/stories/2026-08-16-deepmind-multi-agent-safety-50m.md
            - site/src/content/stories/2026-08-16-gpt-5-6-faster-cheaper.md
            - site/src/content/stories/2026-08-17-claude-opus-5-500k-context.md
